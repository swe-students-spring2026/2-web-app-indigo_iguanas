<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Habits</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
  <div class="dashboard-wrapper">
    <h1>Add a Habit</h1>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('dashboard.create_habit') }}">
      <input 
        type="text"
        name="name"
        placeholder="Habit name"
        required
        value="{{ form.name if form else '' }}"
      >

      <input
        type="text"
        name="category"
        placeholder="Category (optional)"
        value="{{ form.category if form else '' }}"
      >

      <textarea name="notes" placeholder="Notes (optional)">{{ form.notes if form else '' }}</textarea>

      <label for="schedule_type">Occurrence</label>
      <select name="schedule_type" id="schedule_type" onchange="toggleCustomDays()">
        <option value="daily" {% if form and form.schedule_type == 'daily' %}selected{% endif %}>Daily</option>
        <option value="weekly" {% if form and form.schedule_type == 'weekly' %}selected{% endif %}>Weekly</option>
        <option value="biweekly" {% if form and form.schedule_type == 'biweekly' %}selected{% endif %}>Biweekly</option>
        <option value="monthly" {% if form and form.schedule_type == 'monthly' %}selected{% endif %}>Monthly</option>
        <option value="custom" {% if form and form.schedule_type == 'custom' %}selected{% endif %}>Custom</option>
      </select>

      <div id="custom-days" style="display:none; margin-top:10px;">
        <div class="muted" style="margin-bottom:6px;">Pick days</div>
        <label><input type="checkbox" name="custom_days" value="0"> Mon</label>
        <label><input type="checkbox" name="custom_days" value="1"> Tue</label>
        <label><input type="checkbox" name="custom_days" value="2"> Wed</label>
        <label><input type="checkbox" name="custom_days" value="3"> Thu</label>
        <label><input type="checkbox" name="custom_days" value="4"> Fri</label>
        <label><input type="checkbox" name="custom_days" value="5"> Sat</label>
        <label><input type="checkbox" name="custom_days" value="6"> Sun</label>
      </div>

      <label style="margin-top:12px;">Target</label>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input
          type="number"
          step="0.1"
          name="goal_value"
          placeholder="Value"
          required
          value="{{ form.goal_value if form else '' }}"
          style="flex:1; min-width:120px;"
        >

        <select name="goal_unit" style="flex:1; min-width:140px;">
          <option value="times" {% if form and form.goal_unit == 'times' %}selected{% endif %}>times</option>
          <option value="minutes" {% if form and form.goal_unit == 'minutes' %}selected{% endif %}>minutes</option>
          <option value="pages" {% if form and form.goal_unit == 'pages' %}selected{% endif %}>pages</option>
          <option value="steps" {% if form and form.goal_unit == 'steps' %}selected{% endif %}>steps</option>
        </select>

        <select name="goal_period" style="flex:1; min-width:140px;">
          <option value="day" {% if form and form.goal_period == 'day' %}selected{% endif %}>per day</option>
          <option value="week" {% if form and form.goal_period == 'week' %}selected{% endif %}>per week</option>
          <option value="month" {% if form and form.goal_period == 'month' %}selected{% endif %}>per month</option>
        </select>
      </div>

      <label for="type" style="margin-top:12px;">Type</label>
      <select name="type" id="type" onchange="toggleCountFields()">
        <option value="binary" {% if form and form.type == 'binary' %}selected{% endif %}>Checkbox (done or not)</option>
        <option value="count" {% if form and form.type == 'count' %}selected{% endif %}>Count / Amount</option>
      </select>

      <div id="count-fields" style="margin-top:10px;">
        <input
          type="text"
          name="unit"
          placeholder="Unit (e.g., cups, minutes, pages)"
          value="{{ form.unit if form else '' }}"
        >
        <input
          type="number"
          step="0.1"
          name="target"
          placeholder="Legacy target (optional)"
          value="{{ form.target if form else '' }}"
        >
      </div>

      <button type="submit" class="primary-button">Create Habit</button>
    </form>

    <div style="margin-top: 16px">
      <a href="/createhabits">View Habits</a>
      <span> . </span>
      <a href="{{ url_for('dashboard.dashboard') }}">Back to Dashboard</a>
    </div>

    <script>
      function toggleCountFields() {
        const type = document.getElementById('type').value;
        document.getElementById('count-fields').style.display = (type === 'count') ? 'block' : 'none';
      }

      function toggleCustomDays() {
        const scheduleType = document.getElementById('schedule_type').value;
        document.getElementById('custom-days').style.display = (scheduleType === 'custom') ? 'block' : 'none';
      }

      toggleCountFields();
      toggleCustomDays();
    </script>
  </div>
</body>

</html>
