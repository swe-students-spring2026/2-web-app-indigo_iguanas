<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
  <div class="top-button">
    <a href="{{ url_for('profile') }}" style="text-decoration:none;">
      <button style="
          padding:8px 14px;
          border:none;
          border-radius:6px;
          background:#f0f2f5;
          font-weight:bold;
          cursor:pointer;
      ">
          Profile
      </button>
    </a>
  </div>

  <div class="dashboard-wrapper">
    <h1>Edit Profile</h1>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('edit_profile') }}" style="width:100%;">
      <label for="username">Username</label>
      <input id="username" name="username" required value="{{ user.get('username','') }}">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ user.get('email','') }}">

      <div class="bottom-actions" style="width:100%;">
        <button type="submit" class="primary-button">Save Changes</button>
        <a href="{{ url_for('profile') }}" class="logout-link">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
