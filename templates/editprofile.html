

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
  <div class="dashboard-wrapper">
    <h1>Edit Profile</h1>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('edit_profile') }}">
      <ul class="habit-list">
        <li class="habit-card">
          <label for="username"><strong>Username</strong></label>
          <input
            id="username"
            name="username"
            type="text"
            class="search-input"
            value="{{ user.get('username','') }}"
            placeholder="Enter a username"
          />

          <label for="email" style="margin-top:12px;"><strong>Email</strong></label>
          <input
            id="email"
            name="email"
            type="email"
            class="search-input"
            value="{{ user.get('email','') }}"
            placeholder="Enter your email"
          />
        </li>
      </ul>

      <h2>Change Password</h2>
      <ul class="habit-list">
        <li class="habit-card">
          <label for="current_password"><strong>Current Password</strong></label>
          <input
            id="current_password"
            name="current_password"
            type="password"
            class="search-input"
            placeholder="Current password"
          />

          <label for="new_password" style="margin-top:12px;"><strong>New Password</strong></label>
          <input
            id="new_password"
            name="new_password"
            type="password"
            class="search-input"
            placeholder="New password"
          />

          <label for="confirm_password" style="margin-top:12px;"><strong>Confirm New Password</strong></label>
          <input
            id="confirm_password"
            name="confirm_password"
            type="password"
            class="search-input"
            placeholder="Confirm new password"
          />
        </li>
      </ul>

      <div class="bottom-actions">
        <button type="submit" class="primary-button">Save Changes</button>
        <a href="{{ url_for('profile') }}" class="logout-link">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
