<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroHabit Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="dashboard-wrapper">
    <h1>Welcome to MicroHabit Dashboard</h1>

    <form method="POST" action="{{ url_for('dashboard.create_habit') }}">
        <input type="text" name="name" placeholder="Enter habit name" required>
        <button type="submit">Add Habit</button>
    </form>
   
    

   <h2>Habit List</h2>


    {% if habits %}
       <ul>
    {% for habit in habits %}
        <li>
            <span>{{ habit.name }}</span>

            <form method="POST" action="{{ url_for('dashboard.toggle_habit', habit_id=habit._id) }}">
                <input 
                    type="checkbox"
                    name="completed"
                    onchange="this.form.submit()"
                    {% if habit.completed_today %} checked {% endif %}
                >
            </form>

            <span> {{ habit.streak }}</span>
        </li>
    {% endfor %}
    </ul>
   {% else %}
       <p>No habits yet. Add one above </p>
   {% endif %}
    
    <form action="{{ url_for('dashboard.search_page') }}" method="GET">
    <button type="primary-button">Search Habits</button>
    </form>

   
</div>
</body>
</html>
